name: Update catalog and deploy Pages
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Источник для проверки (all — полный сбор)'
        type: choice
        default: all
        options: [all, arr, rbn, avito, cian, domclick]
  push:
    branches: [main]
    paths-ignore: ['data/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: investscan-pipeline
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Test financial and geographic logic
        run: python -m pytest -q
      - name: Test filters
        run: node --test tests/*.test.js
      - name: Collect independently and preserve catalog on source errors
        if: github.event_name != 'push'
        env:
          INVESTSCAN_SOURCES: ${{ inputs.sources || 'all' }}
          INVESTSCAN_PHOTON: '1'
        run: python scripts/update_catalog.py
      - name: Save data and database
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh listings, history and geocode cache'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare public files only
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r css js _site/
          cp data/listings.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
